version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  # Dev dependencies only. There are no runtime dependencies and keeping it that
  # way is deliberate: every package this one depends on is a package every app
  # using it also depends on, whether that app wanted it or not.
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
